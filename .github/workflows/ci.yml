name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  qualidade-e-testes:
    name: Ruff e Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestao_comercial_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar verificação de código (Ruff)
        run: |
          ruff check .

      - name: Executar testes (Pytest)
        env:
          DJANGO_SECRET_KEY: "chave-secreta-de-teste-para-o-ambiente-ci"
          DATABASE_URL: "postgres://postgres:postgrespassword@localhost:5432/gestao_comercial_ci"
        run: |
          pytest