services:
  db:
    image: postgres:16-alpine
    container_name: gestao_comercial_db
    environment:
      POSTGRES_DB: gestao_comercial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_comercial"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dados: